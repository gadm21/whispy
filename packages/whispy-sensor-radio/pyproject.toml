[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whispy-sensor-radio"
version = "0.1.0"
description = "Host Wi-Fi/BLE radio-environment scanner for Whispy — netsh/iw + BlueZ(bleak)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["whispy>=0.1.0"]

[project.optional-dependencies]
ble = ["bleak>=0.21"]

[project.entry-points."whispy.sensors"]
radio_env = "whispy_sensor_radio:RadioSensorAdapter"

[tool.setuptools.packages.find]
include = ["whispy_sensor_radio*"]
