[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whispy-sensor-opencv-camera"
version = "0.1.0"
description = "OpenCV camera sensor adapter for Whispy (UVC/integrated cameras on Windows/Linux/macOS)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "whispy>=0.1.0",
    "opencv-python>=4.8",
    "numpy>=1.24",
]

[project.entry-points."whispy.sensors"]
opencv-camera = "whispy_sensor_opencv_camera:OpenCvCameraAdapter"

[tool.setuptools.packages.find]
include = ["whispy_sensor_opencv_camera*"]
