[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whispy-actuator-speaker"
version = "0.1.0"
description = "Speaker actuator adapter for Whispy (Windows SAPI / pyttsx3 TTS, PCM playback)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["whispy>=0.1.0"]

[project.optional-dependencies]
tts = ["pyttsx3>=2.90"]

[project.entry-points."whispy.actuators"]
speaker = "whispy_actuator_speaker:SpeakerActuatorAdapter"

[tool.setuptools.packages.find]
include = ["whispy_actuator_speaker*"]
