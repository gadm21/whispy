[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whispy-model-whisper-stt"
version = "0.1.0"
description = "Whisper speech-to-text model plugin for Whispy (faster-whisper backend)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "whispy>=0.1.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
faster = ["faster-whisper>=1.0"]
torch = ["openai-whisper>=20231117", "torch>=2.0"]

[project.entry-points."whispy.models"]
whisper-stt = "whispy_model_whisper_stt:WhisperSttModel"

[tool.setuptools.packages.find]
include = ["whispy_model_whisper_stt*"]
