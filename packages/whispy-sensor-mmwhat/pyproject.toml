[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whispy-sensor-mmwhat"
version = "0.1.0"
description = "MMW-HAT BGT60TR13C mmWave radar adapter for Whispy (custom spidev driver)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "whispy>=0.1.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
hardware = ["spidev>=3.5", "gpiozero>=2.0"]

[project.entry-points."whispy.sensors"]
mmwhat-radar = "whispy_sensor_mmwhat:MmwhatRadarAdapter"

[tool.setuptools.packages.find]
include = ["whispy_sensor_mmwhat*"]
