[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whispy-sensor-csi"
version = "0.1.0"
description = "Wi-Fi CSI sensor adapter for Whispy (ESP32 UDP streams / monitor-mode NICs)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["whispy>=0.1.0"]

[project.entry-points."whispy.sensors"]
csi = "whispy_sensor_csi:CsiSensorAdapter"

[tool.setuptools.packages.find]
include = ["whispy_sensor_csi*"]
