[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whispy-actuator-sensehat"
version = "0.1.0"
description = "Raspberry Pi Sense HAT LED matrix actuator adapter for Whispy"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["whispy>=0.1.0"]

[project.optional-dependencies]
hardware = ["sense-hat>=2.6; platform_system=='Linux'"]

[project.entry-points."whispy.actuators"]
sensehat-matrix = "whispy_actuator_sensehat:SenseHatMatrixAdapter"

[tool.setuptools.packages.find]
include = ["whispy_actuator_sensehat*"]
