<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thothcraft Docs</title>
  <meta name="description" content="Thothcraft programmable sensing platform — Whispy SDK, Thoth nodes, Brain cloud, thothHUB." />
  <link rel="icon" href="public/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root {
      --theme-color: #0891b2;
      --theme-color-light: #22d3ee;
    }
    .sidebar > h1 a { color: #0f172a; font-weight: 700; }
    .markdown-section h1, .markdown-section h2 { letter-spacing: -0.02em; }
    .hero-actions { margin: 1.25rem 0 0.5rem; display: flex; gap: 0.75rem; }
    .hero-actions .btn {
      display: inline-block; padding: 0.6rem 1.2rem; border-radius: 0.6rem;
      border: 1px solid #cbd5e1; color: #0f172a; font-weight: 600; text-decoration: none;
    }
    .hero-actions .btn.brand { background: #0891b2; border-color: #0891b2; color: #fff; }
    .markdown-section table { display: table; width: 100%; }
  </style>
</head>
<body>
  <div id="app">Loading Thothcraft docs…</div>
  <script>
    window.$docsify = {
      name: 'Thothcraft',
      repo: 'https://github.com/thothcraft/whispy',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      nameLink: { '/': '#/' },
      search: { paths: 'auto', placeholder: 'Search docs' },
      copyCode: { buttonText: 'Copy', errorText: 'Error', successText: 'Copied' },
      pagination: { previousText: 'Previous', nextText: 'Next' },
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
</body>
</html>
